services:

  db:
    image: postgres:15
    container_name: fintech_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: ./backend
    container_name: fintech_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/fintech
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app


  frontend:
    build: ./frontend
    container_name: fintech_frontend
    restart: always
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: /api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules


  nginx:
    image: nginx:latest
    container_name: fintech_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf


volumes:
  postgres_data: